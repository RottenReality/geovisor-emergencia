name: geovisor

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: geo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geovisor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-geovisor}
    # Tuning ajustado a una VPS de 3.7 GiB que YA tiene otro stack corriendo.
    # No subir shared_buffers: el margen restante es para GDAL y page cache.
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=1GB
      -c max_connections=30
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geovisor} -d ${POSTGRES_DB:-geovisor}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [geo]

  api:
    build: ./backend
    container_name: geo_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-geovisor}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-geovisor}
    volumes:
      - ./datos:/datos
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    networks: [geo]

  caddy:
    image: caddy:2-alpine
    container_name: geo_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:-5.161.176.32.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    depends_on: [api]
    networks: [geo]

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  geo:
    name: geovisor_net
